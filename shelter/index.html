<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__container"></div>
    </header>

    <main class="main-content">
      <section class="start-screen">
        <div class="start-screen__container">
          <div class="start-screen__content">
            <h1 class="start-screen__heading">Not only people need a house</h1>
            <p class="start-screen__subheading">
              We offer to give a chance to a little and nice puppy with an
              extremely wide and open heart. He or she will love you more than
              anybody else in the world, you will see!
            </p>
            <a class="button button--primary">
              <span class="button__text">Make a friend</span>
            </a>
          </div>
          <img
            class="start-screen__image"
            src="assets/images/start-screen-puppy.png"
            alt="Photo of a dog"
          />
        </div>
      </section>

      <section id="about" class="about">
        <div class="about__container"></div>
      </section>

      <section id="our-friends" class="pets">
        <div class="pets__container"></div>
      </section>

      <section id="help" class="help">
        <div class="help__container"></div>
      </section>

      <section class="donation">
        <div class="donation__container"></div>
      </section>
    </main>

    <footer id="contacts" class="footer">
      <div class="footer__container"></div>
    </footer>
  </body>
</html>
