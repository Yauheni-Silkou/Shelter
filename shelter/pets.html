<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pets</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__container"></div>
    </header>

    <main class="main-content">
      <section class="our-pets">
        <div class="our-pets__container">
          <h1 class="our-pets__heading">
            Our friends who<br />are looking for a house
          </h1>

          <div class="cards-container">
            <article class="pet-card">
              <img
                class="pet-card__image"
                src="assets/images/pets-katrine_2.png"
                alt="Katrine"
              />
              <h2 class="pet-card__title">Katrine</h2>
              <button class="button button--secondary">Learn more</button>
            </article>

            <article class="pet-card">
              <img
                class="pet-card__image"
                src="assets/images/pets-jennifer.png"
                alt="Jennifer"
              />
              <h2 class="pet-card__title">Jennifer</h2>
              <button class="button button--secondary">Learn more</button>
            </article>

            <article class="pet-card">
              <img
                class="pet-card__image"
                src="assets/images/pets-woody.png"
                alt="Woody"
              />
              <h2 class="pet-card__title">Woody</h2>
              <button class="button button--secondary">Learn more</button>
            </article>

            <article class="pet-card">
              <img
                class="pet-card__image"
                src="assets/images/pets-katrine_1.png"
                alt="Sophia"
              />
              <h2 class="pet-card__title">Sophia</h2>
              <button class="button button--secondary">Learn more</button>
            </article>

            <article class="pet-card">
              <img
                class="pet-card__image"
                src="assets/images/pets-timmy.png"
                alt="Timmy"
              />
              <h2 class="pet-card__title">Timmy</h2>
              <button class="button button--secondary">Learn more</button>
            </article>

            <article class="pet-card">
              <img
                class="pet-card__image"
                src="assets/images/pets-charly.png"
                alt="Charly"
              />
              <h2 class="pet-card__title">Charly</h2>
              <button class="button button--secondary">Learn more</button>
            </article>

            <article class="pet-card">
              <img
                class="pet-card__image"
                src="assets/images/pets-scarlet.png"
                alt="Scarlett"
              />
              <h2 class="pet-card__title">Scarlett</h2>
              <button class="button button--secondary">Learn more</button>
            </article>

            <article class="pet-card">
              <img
                class="pet-card__image"
                src="assets/images/pets-katrine.png"
                alt="Freddie"
              />
              <h2 class="pet-card__title">Freddie</h2>
              <button class="button button--secondary">Learn more</button>
            </article>
          </div>

          <nav class="pagination" aria-label="Pets catalog pagination">
            <button
              class="pagination__button pagination__button--disabled"
              disabled
            >
              &lt;&lt;
            </button>

            <button
              class="pagination__button pagination__button--disabled"
              disabled
            >
              &lt;
            </button>

            <button class="pagination__button pagination__button--active">
              1
            </button>

            <button class="pagination__button">&gt;</button>

            <button class="pagination__button">&gt;&gt;</button>
          </nav>
        </div>
      </section>
    </main>

    <footer id="contacts" class="footer">
      <div class="footer__container"></div>
    </footer>
  </body>
</html>
